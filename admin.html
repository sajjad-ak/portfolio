<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Messages</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      padding-top: 20px;
      padding-bottom: 50px;
    }
    .admin-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .admin-stats {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(201, 177, 138, 0.2);
      border-radius: 12px;
      padding: 20px;
      flex: 1;
      text-align: center;
    }
    .stat-card h3 {
      font-size: 2rem;
      color: var(--primary-color);
      margin-bottom: 5px;
    }
    .messages-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .message-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 20px;
      position: relative;
      transition: all 0.3s ease;
    }
    .message-card.unread {
      border-left: 4px solid var(--primary-color);
      background: rgba(201, 177, 138, 0.05);
    }
    .msg-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      align-items: center;
    }
    .msg-subject {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 10px;
      color: #fff;
    }
    .msg-sender {
      color: #aaa;
      font-size: 0.9rem;
    }
    .msg-date {
      color: #888;
      font-size: 0.8rem;
    }
    .msg-body {
      background: rgba(0, 0, 0, 0.2);
      padding: 15px;
      border-radius: 6px;
      margin-top: 10px;
      color: #ddd;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .msg-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      justify-content: flex-end;
    }
    .btn-small {
      padding: 5px 12px;
      font-size: 0.8rem;
      background: transparent;
      border: 1px solid var(--primary-color);
      color: var(--primary-color);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-small:hover {
      background: var(--primary-color);
      color: var(--page-bg);
    }
    .btn-danger {
      border-color: #ff4d4d;
      color: #ff4d4d;
    }
    .btn-danger:hover {
      background: #ff4d4d;
      color: white;
    }
    .back-link {
      color: var(--primary-color);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #888;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <h2><i class="fas fa-inbox"></i> Inbox Dashboard</h2>
      <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>
    </div>

    <div class="admin-stats">
      <div class="stat-card">
        <h3 id="stat-total">0</h3>
        <p>Total Messages</p>
      </div>
      <div class="stat-card">
        <h3 id="stat-unread">0</h3>
        <p>Unread</p>
      </div>
    </div>

    <div class="messages-list" id="messages-container">
      <!-- Messages will be loaded here -->
      <div class="empty-state">Loading messages...</div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      fetchMessages();
    });

    async function fetchMessages() {
      try {
        const response = await fetch('/api/messages');
        const messages = await response.json();
        renderMessages(messages);
      } catch (error) {
        console.error('Error fetching messages:', error);
        document.getElementById('messages-container').innerHTML = 
          '<div class="empty-state">Error loading messages. Please try again later.</div>';
      }
    }

    function renderMessages(messages) {
      const container = document.getElementById('messages-container');
      
      // Update stats
      document.getElementById('stat-total').textContent = messages.length;
      document.getElementById('stat-unread').textContent = messages.filter(m => !m.is_read).length;

      if (messages.length === 0) {
        container.innerHTML = '<div class="empty-state"><i class="fas fa-envelope-open fa-3x" style="margin-bottom:15px; opacity:0.5;"></i><br>No messages yet.</div>';
        return;
      }

      container.innerHTML = '';
      
      messages.forEach(msg => {
        const date = new Date(msg.created_at).toLocaleString();
        const card = document.createElement('div');
        card.className = `message-card ${msg.is_read ? '' : 'unread'}`;
        card.innerHTML = `
          <div class="msg-header">
            <div class="msg-sender">
              <strong>${escapeHtml(msg.name)}</strong> &lt;<a href="mailto:${escapeHtml(msg.email)}" style="color:#aaa;">${escapeHtml(msg.email)}</a>&gt;
            </div>
            <div class="msg-date">${date}</div>
          </div>
          <div class="msg-subject">${escapeHtml(msg.subject)}</div>
          <div class="msg-body">${escapeHtml(msg.message)}</div>
          <div class="msg-actions">
            ${msg.is_read ? '' : `<button class="btn-small" onclick="markAsRead(${msg.id})"><i class="fas fa-check"></i> Mark as Read</button>`}
            <button class="btn-small btn-danger" onclick="deleteMessage(${msg.id})"><i class="fas fa-trash"></i> Delete</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function markAsRead(id) {
      try {
        await fetch(`/api/messages/${id}/read`, { method: 'PATCH' });
        fetchMessages();
      } catch (error) {
        console.error('Error marking as read:', error);
      }
    }

    async function deleteMessage(id) {
      if (!confirm('Are you sure you want to delete this message?')) return;
      try {
        await fetch(`/api/messages/${id}`, { method: 'DELETE' });
        fetchMessages();
      } catch (error) {
        console.error('Error deleting message:', error);
      }
    }

    function escapeHtml(unsafe) {
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
