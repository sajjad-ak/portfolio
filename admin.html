<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Messages</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary:   #c9b18a;
      --primary-l: #d4c4a8;
      --secondary: #e8d5b7;
      --accent:    #b8a07a;
      --bg:        #121212;
      --surface:   rgba(30, 30, 30, 0.7);
      --border:    rgba(201, 177, 138, 0.2);
      --text-muted:#9a8f7a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--primary);
      min-height: 100vh;
    }

    /* ── Canvas background ─────────────────────────────────── */
    canvas#admin-bg {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
    }

    /* ── Layout ───────────────────────────────────────────── */
    .admin-wrap {
      position: relative; z-index: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* ── Top bar ──────────────────────────────────────────── */
    .admin-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .admin-topbar-left {
      display: flex; align-items: center; gap: 0.8rem;
    }

    .admin-topbar-left .shield-icon {
      width: 42px; height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(201,177,138,.15), rgba(232,213,183,.08));
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      color: var(--primary);
    }

    .admin-topbar h2 {
      font-size: 1.3rem; font-weight: 700;
      color: var(--primary-l);
    }

    .admin-topbar p {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .topbar-actions {
      display: flex; align-items: center; gap: 0.8rem;
      flex-wrap: wrap;
    }

    .back-link, .logout-btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem; font-weight: 500;
      cursor: pointer;
      transition: all .2s;
      text-decoration: none;
    }

    .back-link {
      color: var(--text-muted);
      border: 1px solid rgba(201,177,138,.2);
      background: transparent;
    }
    .back-link:hover {
      color: var(--primary);
      border-color: var(--primary);
    }

    .logout-btn {
      color: #fca5a5;
      border: 1px solid rgba(220,38,38,.3);
      background: rgba(220,38,38,.08);
      font-family: 'Poppins', sans-serif;
    }
    .logout-btn:hover {
      background: rgba(220,38,38,.18);
      border-color: rgba(220,38,38,.6);
    }

    /* ── Stats ────────────────────────────────────────────── */
    .admin-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--surface);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.4rem;
      text-align: center;
      transition: transform .3s, box-shadow .3s;
    }
    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0,0,0,.3);
    }

    .stat-card .stat-num {
      font-size: 2.4rem; font-weight: 700;
      color: var(--primary);
      display: block;
      text-shadow: 0 0 16px rgba(201,177,138,.3);
    }

    .stat-card p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    /* ── Filter bar ───────────────────────────────────────── */
    .filter-bar {
      display: flex; align-items: center; gap: 0.6rem;
      margin-bottom: 1.4rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 0.4rem 1rem;
      border-radius: 20px;
      border: 1px solid rgba(201,177,138,.2);
      background: transparent;
      color: var(--text-muted);
      font-family: 'Poppins', sans-serif;
      font-size: 0.82rem; cursor: pointer;
      transition: all .2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: linear-gradient(135deg, #c9b18a, #d4c4a8);
      border-color: transparent;
      color: #121212;
      font-weight: 600;
    }

    /* ── Messages list ────────────────────────────────────── */
    .messages-list {
      display: flex; flex-direction: column; gap: 1rem;
    }

    .message-card {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      padding: 1.5rem;
      position: relative;
      transition: all .3s;
      animation: cardIn .4s ease both;
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(10px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .message-card:hover {
      border-color: rgba(201,177,138,.25);
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }

    .message-card.unread {
      border-left: 4px solid var(--primary);
      background: rgba(201,177,138,.04);
    }

    .msg-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.7rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .msg-sender-wrap { display: flex; align-items: center; gap: 0.7rem; }

    .msg-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, rgba(201,177,138,.2), rgba(232,213,183,.1));
      border: 1px solid var(--border);
      font-size: 0.8rem; font-weight: 700;
      color: var(--primary-l); flex-shrink: 0;
    }

    .msg-sender { font-size: 0.9rem; color: var(--primary-l); font-weight: 600; }
    .msg-email  { font-size: 0.78rem; color: var(--text-muted); }

    .msg-meta { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .msg-date  { font-size: 0.78rem; color: #666; }

    .badge-unread {
      font-size: 0.68rem; font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 20px;
      background: rgba(201,177,138,.15);
      color: var(--primary);
      border: 1px solid rgba(201,177,138,.3);
      text-transform: uppercase; letter-spacing: .04em;
    }

    .msg-subject {
      font-size: 1rem; font-weight: 600;
      color: #fff;
      margin-bottom: 0.7rem;
    }

    .msg-body {
      background: rgba(0,0,0,.25);
      padding: 1rem;
      border-radius: 8px;
      color: #ccc;
      font-size: 0.88rem;
      line-height: 1.7;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,.04);
    }

    .msg-actions {
      display: flex; gap: 0.6rem;
      margin-top: 1rem;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .btn-sm {
      padding: 0.38rem 0.9rem;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      display: inline-flex; align-items: center; gap: 0.35rem;
      transition: all .2s;
      border: 1px solid;
    }
    .btn-read  { border-color: var(--primary); color: var(--primary); background: transparent; }
    .btn-read:hover  { background: var(--primary); color: #121212; }
    .btn-del   { border-color: rgba(220,38,38,.5); color: #f87171; background: transparent; }
    .btn-del:hover   { background: rgba(220,38,38,.15); border-color: #f87171; }
    .btn-reply { border-color: rgba(74,222,128,.4); color: #4ade80; background: transparent; }
    .btn-reply:hover { background: rgba(74,222,128,.1); border-color: #4ade80; }

    /* ── Empty / loading ──────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 3.5rem;
      color: var(--text-muted);
      background: rgba(255,255,255,.02);
      border: 1px dashed rgba(201,177,138,.15);
      border-radius: 12px;
    }
    .empty-state i { display: block; font-size: 2.5rem; margin-bottom: 1rem; opacity: .4; }

    /* ── Loader spinner ───────────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 28px; height: 28px;
      border: 3px solid rgba(201,177,138,.15);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ───────────────────────────────────────── */
    @media (max-width: 600px) {
      .admin-topbar { flex-direction: column; align-items: flex-start; }
      .msg-header   { flex-direction: column; }
    }
  </style>
</head>
<body>
  <canvas id="admin-bg"></canvas>

  <div class="admin-wrap">

    <!-- Top bar -->
    <div class="admin-topbar">
      <div class="admin-topbar-left">
        <div class="shield-icon"><i class="fas fa-inbox"></i></div>
        <div>
          <h2>Message Inbox</h2>
          <p>Secure Admin Dashboard</p>
        </div>
      </div>
      <div class="topbar-actions">
        <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Portfolio</a>
        <button class="logout-btn" onclick="logout()"><i class="fas fa-right-from-bracket"></i> Logout</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="admin-stats">
      <div class="stat-card">
        <span class="stat-num" id="stat-total">—</span>
        <p>Total Messages</p>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="stat-unread">—</span>
        <p>Unread</p>
      </div>
      <div class="stat-card">
        <span class="stat-num" id="stat-read">—</span>
        <p>Read</p>
      </div>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all"   onclick="setFilter('all',   this)">All</button>
      <button class="filter-btn"         data-filter="unread" onclick="setFilter('unread', this)">Unread</button>
      <button class="filter-btn"         data-filter="read"   onclick="setFilter('read',   this)">Read</button>
    </div>

    <!-- Messages -->
    <div class="messages-list" id="messages-container">
      <div class="empty-state"><div class="spinner"></div><p style="margin-top:1rem;">Loading messages…</p></div>
    </div>

  </div>

  <script>
    // ── Mini neural-net background ─────────────────────────────
    (function () {
      const canvas = document.getElementById('admin-bg');
      const ctx = canvas.getContext('2d');
      const GOLD = [201, 177, 138];
      let W, H, nodes = [], pulseT = 0;
      class Node {
        constructor() {
          this.x = Math.random() * W; this.y = Math.random() * H;
          this.r = 1.5 + Math.random() * 2;
          const sp = 0.12 + Math.random() * 0.2, a = Math.random() * Math.PI * 2;
          this.vx = Math.cos(a)*sp; this.vy = Math.sin(a)*sp;
          this.alpha = 0.25 + Math.random() * 0.35; this.po = Math.random() * Math.PI * 2;
        }
        update() {
          this.x += this.vx; this.y += this.vy;
          if (this.x < -10) this.x = W + 10; if (this.x > W + 10) this.x = -10;
          if (this.y < -10) this.y = H + 10; if (this.y > H + 10) this.y = -10;
        }
        draw() {
          const p = 0.7 + 0.3 * Math.sin(pulseT + this.po);
          const a = this.alpha * p; const [r,g,b] = GOLD;
          ctx.beginPath(); ctx.arc(this.x, this.y, this.r * p, 0, Math.PI * 2);
          const gr = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r * 4);
          gr.addColorStop(0, `rgba(${r},${g},${b},${a})`);
          gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
          ctx.fillStyle = gr; ctx.fill();
        }
      }
      function resize() {
        const dpr = window.devicePixelRatio || 1;
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W * dpr; canvas.height = H * dpr;
        canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      function loop() {
        ctx.clearRect(0, 0, W, H); pulseT += 0.006;
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
            const d = Math.sqrt(dx*dx + dy*dy);
            if (d < 160) {
              ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y); ctx.lineTo(nodes[j].x, nodes[j].y);
              ctx.strokeStyle = `rgba(201,177,138,${(1-d/160)*0.2})`; ctx.lineWidth = 0.5; ctx.stroke();
            }
          }
          nodes[i].update(); nodes[i].draw();
        }
        requestAnimationFrame(loop);
      }
      resize();
      nodes = Array.from({ length: 55 }, () => new Node());
      window.addEventListener('resize', resize, { passive: true });
      loop();
    })();

    // ── Admin logic ────────────────────────────────────────────
    let allMessages = [];
    let currentFilter = 'all';

    document.addEventListener('DOMContentLoaded', fetchMessages);

    async function fetchMessages() {
      try {
        const res = await fetch('/api/messages', { credentials: 'include' });
        if (res.status === 401) {
          window.location.href = '/admin-login';
          return;
        }
        allMessages = await res.json();
        renderMessages();
      } catch (err) {
        document.getElementById('messages-container').innerHTML =
          '<div class="empty-state"><i class="fas fa-circle-exclamation"></i>Error loading messages. Is the server running?</div>';
      }
    }

    function setFilter(f, el) {
      currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      renderMessages();
    }

    function renderMessages() {
      const container = document.getElementById('messages-container');
      const total   = allMessages.length;
      const unread  = allMessages.filter(m => !m.is_read).length;
      document.getElementById('stat-total').textContent  = total;
      document.getElementById('stat-unread').textContent = unread;
      document.getElementById('stat-read').textContent   = total - unread;

      let filtered = allMessages;
      if (currentFilter === 'unread') filtered = allMessages.filter(m => !m.is_read);
      if (currentFilter === 'read')   filtered = allMessages.filter(m =>  m.is_read);

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state"><i class="fas fa-envelope-open"></i>No messages here yet.</div>';
        return;
      }

      container.innerHTML = '';
      filtered.forEach((msg, idx) => {
        const date    = new Date(msg.created_at).toLocaleString();
        const initials = (msg.name || '?').split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
        const card = document.createElement('div');
        card.className = `message-card ${msg.is_read ? '' : 'unread'}`;
        card.style.animationDelay = (idx * 0.05) + 's';
        card.innerHTML = `
          <div class="msg-header">
            <div class="msg-sender-wrap">
              <div class="msg-avatar">${escapeHtml(initials)}</div>
              <div>
                <div class="msg-sender">${escapeHtml(msg.name)}</div>
                <div class="msg-email"><a href="mailto:${escapeHtml(msg.email)}" style="color:inherit;">${escapeHtml(msg.email)}</a></div>
              </div>
            </div>
            <div class="msg-meta">
              ${!msg.is_read ? '<span class="badge-unread">Unread</span>' : ''}
              <span class="msg-date"><i class="far fa-clock" style="margin-right:.3rem;"></i>${date}</span>
            </div>
          </div>
          <div class="msg-subject"><i class="fas fa-tag" style="margin-right:.4rem;opacity:.5;font-size:.8rem;"></i>${escapeHtml(msg.subject)}</div>
          <div class="msg-body">${escapeHtml(msg.message)}</div>
          <div class="msg-actions">
            <a href="mailto:${escapeHtml(msg.email)}?subject=Re: ${encodeURIComponent(msg.subject)}" class="btn-sm btn-reply"><i class="fas fa-reply"></i> Reply</a>
            ${!msg.is_read ? `<button class="btn-sm btn-read" onclick="markRead(${msg.id})"><i class="fas fa-check"></i> Mark Read</button>` : ''}
            <button class="btn-sm btn-del" onclick="deleteMsg(${msg.id})"><i class="fas fa-trash"></i> Delete</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function markRead(id) {
      try {
        await fetch(`/api/messages/${id}/read`, { method: 'PATCH', credentials: 'include' });
        fetchMessages();
      } catch (e) { console.error(e); }
    }

    async function deleteMsg(id) {
      if (!confirm('Delete this message permanently?')) return;
      try {
        await fetch(`/api/messages/${id}`, { method: 'DELETE', credentials: 'include' });
        fetchMessages();
      } catch (e) { console.error(e); }
    }

    async function logout() {
      await fetch('/api/admin/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/admin-login';
    }

    function escapeHtml(s) {
      if (!s) return '';
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
